[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanexus-ai-video-summary"
version = "0.3.0"
description = "AI video summary layer for Frigate"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2.3,<4",
  "pgvector>=0.3.6,<1",
  "alembic>=1.14,<2",
  "redis>=5.2,<9",
  "paho-mqtt>=2.1,<3",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0.1,<2",
  "httpx>=0.28,<1",
  "Pillow>=10,<13",
  "numpy>=1.26,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
openclip = [
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "open-clip-torch>=2.26,<4",
]
openclip-cuda = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "open-clip-torch>=2.26,<4",
]
test = ["pytest>=8.3,<9", "mypy>=1.14,<2", "ruff>=0.9,<1"]

[tool.uv]
conflicts = [
  [
    { extra = "openclip" },
    { extra = "openclip-cuda" },
  ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "openclip", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu130", extra = "openclip-cuda", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "openclip", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu130", extra = "openclip-cuda", marker = "sys_platform == 'linux'" },
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

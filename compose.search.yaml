name: nanexus-video-summary-search
services:
  video-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: video_summary
      POSTGRES_USER: nanexus
      POSTGRES_PASSWORD: nanexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanexus -d video_summary"]
      interval: 5s
      timeout: 3s
      retries: 10
  video-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.search
    command: ["alembic", "upgrade", "head"]
    environment: &search-env
      DATABASE_URL: postgresql+psycopg://nanexus:nanexus@video-db:5432/video_summary
      REDIS_URL: redis://event-redis:6379/1
      EMBEDDING_DIM: "512"
    depends_on:
      video-db:
        condition: service_healthy
  embedding-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.search
    environment: *search-env
    depends_on:
      video-migrate:
        condition: service_completed_successfully
  summary-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.search
    command: ["python", "-m", "services.summary_worker.main"]
    environment:
      <<: *search-env
      EVENT_INTELLIGENCE_URL: http://event-intelligence:8000
      EVENT_INTELLIGENCE_TOKEN: ${EVENT_INTELLIGENCE_TOKEN:-}
      SUMMARY_MODE: ${SUMMARY_MODE:-rule}
      SUMMARY_TIMEZONE: ${SUMMARY_TIMEZONE:-UTC}
      SUMMARY_SITE_ID: ${SUMMARY_SITE_ID:-default}
      SUMMARY_HOUR: ${SUMMARY_HOUR:-23}
      SUMMARY_MINUTE: ${SUMMARY_MINUTE:-50}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      video-migrate:
        condition: service_completed_successfully
  chat-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.search
    command: ["python", "-m", "services.chat_worker.main"]
    environment:
      <<: *search-env
      MODEL_SERVICE_URL: http://model-service:8010
      CHAT_MODE: ${CHAT_MODE:-extractive}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      video-migrate:
        condition: service_completed_successfully
      model-service:
        condition: service_started
  model-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.model-worker
    command: ["uvicorn", "services.model_service.main:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openclip}
      AI_DEVICE: ${AI_DEVICE:-cpu}
      OPENCLIP_MODEL: ${OPENCLIP_MODEL:-ViT-B-32}
      OPENCLIP_PRETRAINED: ${OPENCLIP_PRETRAINED:-openai}
      EMBEDDING_DIM: "512"
  video-summary-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.search
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *search-env
      MODEL_SERVICE_URL: http://model-service:8010
      EVENT_INTELLIGENCE_URL: http://event-intelligence:8000
      SUMMARY_TIMEZONE: ${SUMMARY_TIMEZONE:-UTC}
      SUMMARY_SITE_ID: ${SUMMARY_SITE_ID:-default}
      LEGACY_API_MODEL_INFERENCE_ENABLED: "false"
    depends_on:
      video-migrate:
        condition: service_completed_successfully
      model-service:
        condition: service_started
